        function MermaidRenderer({ chart }) {
            const containerRef = useRef(null);
            const [error, setError] = useState(null);

            useEffect(() => {
                let isMounted = true;
                let retryCount = 0;

                const renderChart = () => {
                    if (!containerRef.current || !isMounted) return;

                    if (!containerRef.current.isConnected || containerRef.current.offsetWidth === 0) {
                        if (retryCount < 5) {
                            retryCount++;
                            setTimeout(renderChart, 100);
                            return;
                        }
                    }

                    if (window.mermaid) {
                        try {
                            window.mermaid.initialize({
                                startOnLoad: false,
                                theme: 'dark',
                                securityLevel: 'loose',
                                suppressErrorRendering: true,
                                themeVariables: {
                                    darkMode: true,
                                    background: '#0d111a',
                                    primaryColor: '#1e1b4b',
                                    primaryTextColor: '#ffffff',
                                    primaryBorderColor: '#6366f1',
                                    lineColor: '#818cf8',
                                    secondaryColor: '#1e293b',
                                    tertiaryColor: '#0f172a',
                                    actorLineColor: '#475569',
                                    signalColor: '#818cf8',
                                    signalTextColor: '#e2e8f0'
                                }
                            });

                            const id = `mermaid-svg-${Math.random().toString(36).substring(2, 9)}`;

                            window.mermaid.render(id, chart, containerRef.current).then(({ svg }) => {
                                if (isMounted && containerRef.current) {
                                    containerRef.current.innerHTML = svg;
                                    setError(null);
                                }
                            }).catch(err => {
                                console.warn("Mermaid initial render attempt deferred, retrying...", err);
                                if (retryCount < 3) {
                                    retryCount++;
                                    setTimeout(renderChart, 150);
                                } else if (isMounted) {
                                    setError("Diagram render deferred. Click tab or refresh to re-render.");
                                }
                            });
                        } catch (e) {
                            console.error("Mermaid initialization exception:", e);
                            if (isMounted) setError("Mermaid initialization error.");
                        }
                    }
                };

                const timer = setTimeout(() => {
                    requestAnimationFrame(renderChart);
                }, 50);

                return () => {
                    isMounted = false;
                    clearTimeout(timer);
                };
            }, [chart]);

            if (error) {
                return (
                    <div className="p-4 bg-amber-900/20 border border-amber-500/30 text-amber-300 rounded-xl text-xs font-mono text-center">
                        {error}
                    </div>
                );
            }

            return <div ref={containerRef} className="mermaid flex justify-center items-center w-full min-h-[340px] bg-[#0d111a] p-4 rounded-xl border border-indigo-900/40 shadow-xl overflow-x-auto custom-scrollbar" />;
        }

        function CodeBlock({ code, language = "markdown" }) {
            const [copied, setCopied] = useState(false);

            const handleCopy = () => {
                const textarea = document.createElement('textarea');
                textarea.value = code;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                } catch (err) {
                    console.error('Copy failed', err);
                }
                document.body.removeChild(textarea);
            };

            return (
                <div className="relative group rounded-xl bg-[#090d14] border border-dark-border overflow-hidden">
                    <div className="flex items-center justify-between px-4 py-2 bg-dark-card border-b border-dark-border text-xs text-gray-400 font-mono">
                        <span>{language.toUpperCase()} FORMAT</span>

                        >

                            {copied ? 'Copied!' : 'Copy Code'}

                    <pre className="p-4 font-mono text-xs text-indigo-300 leading-relaxed overflow-x-auto whitespace-pre custom-scrollbar">
                        {code}
                    </pre>
                </div>
            );

import json

class HermesAgentLoop:
    def __init__(self, llm_client, tools_registry, max_turns=10):
        self.llm = llm_client
        self.tools = tools_registry
        self.max_turns = max_turns

    def run(self, user_prompt: str) -> str:
        messages = [{"role": "system", "content": SYSTEM_PROMPT_WITH_TOOLS},
                    {"role": "user", "content": user_prompt}]
        
        for turn in range(1, self.max_turns + 1):
            response = self.llm.generate(messages)
            
            # Check for Hermes <tool_call> tags
            tool_match = re.search(r'<tool_call>(.*?)</tool_call>', response, re.DOTALL)
            if not tool_match:
                # No tool call emitted -> Terminal Answer Reached
                return response
            
            # Extract and parse tool payload
            payload = json.loads(tool_match.group(1).strip())
            tool_name = payload["name"]
            tool_args = payload["arguments"]
            
            # Execute tool safely in local sandbox
            tool_result = self.tools.execute(tool_name, tool_args)
            
            # Append interaction & wrap observation in <tool_response>
            messages.append({"role": "assistant", "content": response})
            messages.append({"role": "user", "content": f"<tool_response>{json.dumps(tool_result)}</tool_response>"})
            
        return "Circuit Breaker Triggered: Maximum iteration turns reached without convergence."`;
